<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>A card for you 💌</title>
<meta property="og:title" content="A card for you 💌">
<meta property="og:description" content="Tap to open your card">
<!--
  A photo poster sent as a link (Jarvis → Festivals → 🖼 → 🔗 Link): the card
  is in the #fragment (base64url JSON, never sent to any server), drawn by
  poster.js (made from the app's own poster code). Its lights catch one by
  one (or as they're tapped), a cake's candles are blown out (by themselves,
  or with a tap), then the pop-up; a gift voucher's code shows on its ticket,
  with Copy under it. Nothing but the card on the page.
    k kind, th theme, fr frame, n name, a age, f from, w wish, c closing,
    p photo, b background (https / data:image), z zoom, y photo up-down,
    v { b brand, a amount (shown), c code, sc code on the picture too },
    ob the opening button's words (default "🎁 Open your surprise")
-->
<style>
  :root { --bg: #0b0614; --ink: #fff7fb; --muted: #d9c7e6; --accent: #ff5e9c; --gold: #f6c445; --glass: rgba(255,255,255,.08); --line: rgba(255,255,255,.16); }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: radial-gradient(ellipse at 50% 0%, #3b1352 0%, transparent 60%), radial-gradient(ellipse at 50% 100%, #0e3a4f 0%, transparent 55%), var(--bg);
    color: var(--ink); font: 15px/1.45 "Poppins", system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100%;
    padding: max(12px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
    -webkit-tap-highlight-color: transparent;
  }
  /* just the card: nothing under it */
  .stage { position: relative; width: min(94vw, calc(100vh - 32px), 640px); min-width: 260px; }
  canvas { display: block; width: 100%; aspect-ratio: 1; border-radius: 18px; box-shadow: 0 0 0 1px rgba(255,255,255,.1), 0 24px 70px -12px rgba(255,94,156,.45); cursor: pointer; touch-action: manipulation; }
  button, .btn {
    font: inherit; font-size: 14px; font-weight: 600; color: var(--ink); text-decoration: none; cursor: pointer;
    padding: 9px 16px; border-radius: 999px; border: 1px solid var(--line); background: var(--glass); backdrop-filter: blur(8px);
    transition: transform .12s, background .2s;
  }
  button:hover, .btn:hover { background: rgba(255,255,255,.16); }
  button:active, .btn:active { transform: scale(.96); }
  button:focus-visible, .btn:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  .primary { border-color: transparent; background: linear-gradient(90deg, #ff4f8b, #ff9a3c); box-shadow: 0 6px 20px rgba(255,79,139,.4); }
  .corner { position: absolute; top: 10px; right: 10px; padding: 4px 10px; font-size: 12px; background: rgba(0,0,0,.45); }

  /* the voucher's code, on the pop-up's ticket: tap it (or Copy under it) to copy */
  .vhit { position: absolute; display: none; left: 44%; width: 28%; top: 83.2%; height: 4.6%; border: 0; padding: 0; border-radius: 999px;
    background: transparent; backdrop-filter: none; -webkit-backdrop-filter: none; cursor: copy; }
  .vbar { position: absolute; left: 0; right: 0; top: 90.6%; display: none; justify-content: center; gap: 6px; animation: rise .5s cubic-bezier(.2,1.4,.4,1) both; }
  .vhit.show { display: block; }
  .vbar.show { display: flex; }
  .vbar button, .vbar .btn { font-size: 12px; padding: 6px 12px; background: rgba(20,8,30,.72); }
  .vbar .primary { background: linear-gradient(90deg, #ff4f8b, #ff9a3c); }
  @keyframes rise { from { opacity: 0; transform: translateY(14px) scale(.94); } to { opacity: 1; transform: none; } }

  /* the cover: a gift to tap open (the tap also lets the sound play) */
  .cover { position: fixed; inset: 0; z-index: 5; display: grid; place-items: center; text-align: center; padding: 24px;
    background: radial-gradient(ellipse at center, rgba(80,20,90,.85), rgba(8,4,16,.96)); backdrop-filter: blur(10px); }
  .cover[hidden] { display: none; }
  .cover .gift { font-size: 92px; line-height: 1; animation: bob 1.6s ease-in-out infinite; filter: drop-shadow(0 10px 30px rgba(255,94,156,.6)); }
  .cover h1 { margin: 18px 0 6px; font-size: clamp(22px, 5vw, 30px); font-weight: 700; text-wrap: balance; }
  .cover p { margin: 0 0 22px; color: var(--muted); }
  .cover button { font-size: 17px; padding: 13px 30px; }
  @keyframes bob { 50% { transform: translateY(-12px) rotate(-4deg); } }
  .bad { margin-top: 30vh; text-align: center; color: var(--muted); max-width: 420px; }
  @media (prefers-reduced-motion: reduce) { .cover .gift, .vbar { animation: none; } }
</style>
</head>
<body>
<div class="cover" id="cover">
  <div>
    <div class="gift" id="coverMark">🎁</div>
    <h1 id="coverTitle">Aapke liye ek card aaya hai 💌</h1>
    <p id="coverFrom"></p>
    <button class="primary" id="open" type="button">🎁 Open your surprise</button>
  </div>
</div>

<div class="stage" id="stage" hidden>
  <canvas id="card" width="1080" height="1080" aria-label="Your card"></canvas>
  <button class="corner" id="sound" type="button" aria-label="Sound on / off">🔊</button>
  <button class="vhit" id="vHit" type="button" aria-label="Copy the gift voucher code" title="Tap to copy"></button>
  <div class="vbar" id="vBar">
    <button class="primary" id="vCopy" type="button">📋 Copy code</button>
  </div>
</div>


<div class="bad" id="bad" hidden>Yeh card ka link poora nahi lag raha. Bhejne wale se dobara bhejne ko kaho 🙏</div>

<script src="poster.js"></script>
<script>
(function () {
  var P = window.Poster;
  var $ = function (id) { return document.getElementById(id); };
  var str = function (v, max) { return String(v == null ? "" : v).slice(0, max); };
  var data = null;
  try {
    var b64 = location.hash.slice(1).replace(/-/g, "+").replace(/_/g, "/");
    var bin = atob(b64 + "===".slice((b64.length + 3) % 4));
    data = JSON.parse(new TextDecoder().decode(Uint8Array.from(bin, function (ch) { return ch.charCodeAt(0); })));
  } catch (e) { data = null; }
  if (!P || !data || typeof data !== "object" || !P.POSTER_KINDS[data.k]) {
    $("cover").hidden = true;
    $("bad").hidden = false;
    return;
  }
  // only pictures from https or a small one inside the link
  var pic = function (v) { v = str(v, 400000); return /^https:\/\/[^\s"'<>]+$/.test(v) || /^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/.test(v) ? v : ""; };
  var v = data.v && typeof data.v === "object" ? data.v : null;
  var opts = {
    kind: data.k, theme: ["classic", "royal", "floral", "neon"].indexOf(data.th) >= 0 ? data.th : "classic", frame: data.fr === "circle" ? "circle" : "side",
    name: str(data.n, 60), age: str(data.a, 4).replace(/\D/g, ""), from: str(data.f, 60), wish: str(data.w, 300), closing: str(data.c, 80),
    zoom: Math.min(2.5, Math.max(1, Number(data.z) || 1)), posY: Math.min(1, Math.max(0, data.y == null ? 0.3 : Number(data.y))),
    photo: null, background: null,
    voucher: v ? { on: true, brand: str(v.b, 24), amount: Number(v.a) || 0, showAmount: Number(v.a) > 0, code: str(v.c, 24).replace(/[^A-Za-z0-9-]/g, "").toUpperCase(), showCode: true } : null
  };
  var K = P.kindOf(opts.kind);
  var lights = P.lightsOf(opts);
  var n = lights.length;
  document.title = K.emoji + " " + K.top + " " + K.title + "!";
  $("coverMark").textContent = K.emoji;
  $("coverTitle").textContent = (opts.name ? opts.name + ", " : "") + "aapke liye ek card aaya hai 💌";
  $("coverFrom").textContent = opts.from ? "— " + opts.from : "";
  // the opening button: the sender's own words, if they gave some
  var openLabel = str(data.ob, 40).trim();
  if (openLabel) $("open").textContent = openLabel;

  var load = function (src) {
    return new Promise(function (resolve) {
      if (!src) return resolve(null);
      var img = new Image();
      img.crossOrigin = "anonymous"; // so it can still be saved; a host that won't allow it is loaded plainly
      img.onload = function () { resolve(img); };
      img.onerror = function () {
        var plain = new Image();
        plain.onload = function () { resolve(plain); };
        plain.onerror = function () { resolve(null); };
        plain.src = src;
      };
      img.src = src;
    });
  };

  var canvas = $("card"), g = canvas.getContext("2d");
  var still = null, sound = true, t0 = performance.now();
  var clock = { lit: lights.map(function () { return null; }), blowAt: null, popAt: null };
  var timers = [], micStop = null, done = false, voucherShown = false;
  var now = function () { return (performance.now() - t0) / 1000; };
  var later = function (fn, ms) { timers.push(setTimeout(fn, ms)); };
  var play = function (fn) { if (sound) { try { fn(); } catch (e) { /* no sound here */ } } };

  // nothing but the card: everything's done by tapping it (see canvas.onclick)
  var litCount = function () { return clock.lit.filter(function (x) { return x != null; }).length; };
  var link = function (label, href) {
    var a = document.createElement("a");
    a.className = "btn";
    a.textContent = label;
    a.href = href;
    a.target = "_blank";
    a.rel = "noopener";
    return a;
  };

  var blowOut = function () {
    if (done || !clock.lit.some(function (x) { return x != null; })) return;
    timers.forEach(clearTimeout); timers = [];
    if (micStop) micStop();
    done = true;
    if (K.blow) clock.blowAt = now(); else clock.popAt = now();
    if (navigator.vibrate) try { navigator.vibrate(150); } catch (e) { /* not here */ }
    if (K.blow) play(P.blowWhoosh);
    later(function () { play(P.tada); }, 600);
    later(function () { play(function () { var s = P.songFor(opts.kind); P.playSong(s.notes, { bpm: s.bpm }); }); }, 1500);
    if (P.voucherOf(opts)) later(showVoucher, 2900); // once the ticket has landed
  };
  var wishThenBlow = function () {
    var left = 3;
    var step = function () {
      if (done) return;
      if (left <= 0) return blowOut();
      left -= 1;
      later(step, 1000);
    };
    step();
  };
  var lightOne = function (k) {
    if (done || clock.lit[k] != null) return;
    clock.lit[k] = now();
    play(function () { P.lightChime(k); });
    if (litCount() === n) { if (K.blow) wishThenBlow(); else later(blowOut, 1300); }
  };
  var lightAll = function () {
    clock.lit.forEach(function (x, k) { if (x == null) later(function () { lightOne(k); }, 250 + k * 600); });
  };
  // the voucher's code, on its ticket in the pop-up: Copy under it, a tap on the code, and where it's redeemed
  var REDEEM = { amazon: "https://www.amazon.in/gc/redeem", flipkart: "https://www.flipkart.com/account/giftcard", myntra: "https://www.myntra.com/giftcard",
    nykaa: "https://www.nykaa.com/gift-card", bookmyshow: "https://in.bookmyshow.com/giftcards", tanishq: "https://www.tanishq.co.in/gift-card" };
  var showVoucher = function () {
    var gv = opts.voucher;
    voucherShown = true;
    if (gv.code) {
      var bar = $("vBar");
      Array.prototype.slice.call(bar.querySelectorAll("a")).forEach(function (a) { a.remove(); });
      var url = REDEEM[gv.brand.toLowerCase().replace(/[^a-z]/g, "")];
      if (url) bar.appendChild(link("🛍 Redeem", url));
      bar.classList.add("show");
      $("vHit").classList.add("show");
    }
  };
  var copyCode = function () {
    var code = opts.voucher.code, b = $("vCopy");
    var ok = function () {
      b.textContent = "✓ Copied: " + code;
      setTimeout(function () { b.textContent = "📋 Copy code"; }, 2200);
    };
    var fallback = function () {
      var t = document.createElement("textarea");
      t.value = code;
      t.setAttribute("readonly", "");
      t.style.position = "fixed"; t.style.opacity = "0";
      document.body.appendChild(t);
      t.select();
      try { document.execCommand("copy"); ok(); } catch (e) { b.textContent = code; }
      t.remove();
    };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(code).then(ok, fallback);
    else fallback();
  };
  $("vCopy").onclick = copyCode;
  $("vHit").onclick = copyCode;

  $("sound").onclick = function () {
    sound = !sound;
    if (!sound) P.stopAll();
    $("sound").textContent = sound ? "🔊" : "🔇";
  };
  // a tap on the card: lights the one tapped (or the rest, one by one); once they're all alight, blows a cake's out
  canvas.onclick = function (e) {
    if (done) return;
    if (litCount() === n) { if (K.blow) blowOut(); return; }
    var r = canvas.getBoundingClientRect();
    var k = P.lightAt(opts, (e.clientX - r.left) / r.width * P.POSTER_SIZE, (e.clientY - r.top) / r.height * P.POSTER_SIZE);
    if (k >= 0) lightOne(k);
    else lightAll();
  };

  // draw: the still layer once, what moves ~30 times a second
  var last = 0;
  var frame = function (ts) {
    requestAnimationFrame(frame);
    if (ts - last < 33 || !still) return;
    last = ts;
    g.drawImage(still, 0, 0);
    P.drawPosterMotion(g, opts, now(), clock);
  };

  var ready = Promise.all([load(pic(data.p)), load(pic(data.b)), P.loadPosterFonts()]).then(function (r) {
    opts.photo = r[0];
    opts.background = r[1];
    still = P.paintPhotoPoster(Object.assign({}, opts, { layer: "base" }));
  });
  $("open").onclick = function () {
    $("cover").hidden = true;
    $("stage").hidden = false;
    t0 = performance.now();
    play(function () { P.tada(); });
    ready.then(function () {
      requestAnimationFrame(frame);
      later(lightAll, 700);
    });
  };
})();
</script>
</body>
</html>
